# SPDX-License-Identifier: Apache-2.0
#
# The firmware's crates, as approved in issue #14. Bazel builds the
# firmware (fw/BUILD.bazel); this manifest only feeds crate_universe,
# which pins every crate in Cargo.lock by its checksum.
[package]
name = "hdlf-example-sensor-fw"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "fw"
path = "src/main.rs"
test = false
bench = false

[dependencies]
cortex-m = { version = "=0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "=0.7.7"
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "=0.1.2"
embassy-stm32 = { version = "=0.6.0", features = ["stm32f042f6", "time-driver-any", "exti"] }
embassy-sync = "=0.8.0"
embassy-time = "=0.5.1"
embassy-usb = "=0.6.0"
embedded-hal = "=1.0.0"
embedded-hal-async = "=1.0.0"
heapless = "=0.9.3"
panic-halt = "=1.0.0"
# The Cortex-M0 has no atomic compare-and-swap: static_cell and embassy
# need portable-atomic's critical-section fallback, which cortex-m's
# critical-section-single-core provides. Already locked, as a dependency
# of embassy; this line only turns the feature on.
portable-atomic = { version = "=1.15.0", features = ["critical-section"] }
static_cell = "=2.1.1"
# Already locked, as embassy-stm32's. Named here, with no features of its
# own, only so the hub repository has an alias for its chip metadata, which
# //fw:pins_rs reads (MODULE.bazel's crate.annotation).
stm32-metapac = { version = "=21.0.0", default-features = false }
