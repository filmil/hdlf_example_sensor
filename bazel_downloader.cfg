# Bazel's downloader config (.bazelrc: --downloader_config). crate_universe
# fetches every crate from static.crates.io; these lines make Bazel try this
# repository's mirror releases first (tools/mirror), then the same files on
# bt.hdlfactory.com (tools/mirror --to=bt), then crates.io itself. Bazel
# tries the rewritten URLs in this order, and checks Cargo.lock's sha256
# whichever answers. The pattern is matched against the URL without its
# scheme, and the URL's own scheme is added back.
rewrite static.crates.io/crates/([^/]+)/([^/]+)/download github.com/filmil/hdlf_example_sensor/releases/download/mirror-crates-1/$1-$2.crate
rewrite static.crates.io/crates/([^/]+)/([^/]+)/download bt.hdlfactory.com/crates/$1-$2.crate
rewrite (static.crates.io/crates/.*) $1
